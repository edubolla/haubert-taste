<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haubert Taste</title>
    <meta
      name="description"
      content="Haubert Taste — hamburgueria artesanal em Campo Bom/RS."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" type="image/png" href="./logotipo/favicon.png" />
    <link rel="apple-touch-icon" href="./logotipo/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./links.css" />
  </head>
  <body>
    <div class="page">

      <header class="lt-header">
        <img
          class="lt-logo"
          src="./logotipo/Prancheta%203.png"
          alt="Haubert Taste"
          width="600"
          height="180"
        />
        <p class="lt-handle">@haubert_taste</p>
        <p class="lt-city">Campo Bom &mdash; RS</p>
      </header>

      <main class="lt-links">

        <a
          class="lt-card"
          href="https://haubert-taste.goomer.app/menu"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_2862%204.JPG'); background-position: center 65%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Peça aqui seu Hambúrguer</span>
              <span class="lt-card__sub">Cardápio completo online</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card"
          href="https://www.ifood.com.br/delivery/campo-bom-rs/hamburguer---haubert-taste-centro/0efa4ca6-277e-4114-91d7-0dd6d5dc6d9a"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_6460%202.JPG'); background-position: center 58%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Peça pelo iFood</span>
              <span class="lt-card__sub">Entrega em Campo Bom</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card lt-card--promo"
          href="https://haubert-taste.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_0386_jpg.JPG'); background-position: center 45%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__badge">Novidade</span>
              <span class="lt-card__title">Promoção Story Premiado</span>
              <span class="lt-card__sub">Poste, marque e concorra</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card"
          href="https://wa.me/5551981939724?text=Ol%C3%A1%2C%20gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20eventos"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_6507.JPG'); background-position: center 38%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Conheça a Haubert Eventos</span>
              <span class="lt-card__sub">Espaço para o seu evento</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card lt-card--flat"
          href="https://wa.me/5551981939724"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-card__content">
            <span class="lt-card__title">Fale Conosco</span>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

      </main>

      <footer class="lt-footer">
        <p>R. Dom Pedro II, 132 &mdash; Centro, Campo Bom / RS</p>
      </footer>

    </div>
  </body>
</html>
