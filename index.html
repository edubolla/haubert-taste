<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haubert Taste</title>
    <meta
      name="description"
      content="Haubert Taste — hamburgueria artesanal em Campo Bom/RS."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" type="image/png" href="./logotipo/favicon.png" />
    <link rel="apple-touch-icon" href="./logotipo/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./links.css" />
  </head>
  <body>
    <div class="page">

      <header class="lt-header">
        <img
          class="lt-logo"
          src="./logotipo/Prancheta%203.png"
          alt="Haubert Taste"
          width="600"
          height="180"
        />
        <a
          class="lt-handle"
          href="https://www.instagram.com/haubert_taste"
          target="_blank"
          rel="noopener noreferrer"
        >@haubert_taste</a>
        <p class="lt-city">Campo Bom &middot; Novo Hamburgo &middot; Sapiranga</p>
      </header>

      <main class="lt-links">

        <a
          class="lt-card"
          href="https://haubert-taste.goomer.app/menu"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_2862%204.JPG'); background-position: center 65%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Peça aqui seu Hambúrguer</span>
              <span class="lt-card__sub">Compre aqui e receba em casa.</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card"
          href="https://www.ifood.com.br/delivery/campo-bom-rs/hamburguer---haubert-taste-centro/0efa4ca6-277e-4114-91d7-0dd6d5dc6d9a"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_6460%202.JPG'); background-position: center 58%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Peça pelo iFood</span>
              <span class="lt-card__sub">Sujeito às taxas do aplicativo.</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card"
          href="https://wa.me/5551981939724?text=Ol%C3%A1%2C%20gostaria%20de%20informa%C3%A7%C3%B5es%20sobre%20eventos"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div
            class="lt-card__photo"
            style="background-image: url('./fotos/IMG_0386.JPG'); background-position: center 45%;"
          ></div>
          <div class="lt-card__overlay"></div>
          <div class="lt-card__content">
            <div class="lt-card__text">
              <span class="lt-card__title">Conheça a Haubert Eventos</span>
              <span class="lt-card__sub">Espaço para o seu evento</span>
            </div>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

        <a
          class="lt-card lt-card--flat"
          href="https://wa.me/5551981939724?text=Ol%C3%A1%2C%20gostaria%20de%20atendimento%21"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="lt-card__content">
            <span class="lt-card__title">Fale Conosco</span>
            <span class="lt-card__arrow" aria-hidden="true">→</span>
          </div>
        </a>

      </main>

      <footer class="lt-footer">
        <div class="lt-footer__icons">
          <a
            class="lt-icon-link"
            href="https://www.instagram.com/haubert_taste"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram da Haubert Taste"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4.5"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </a>
          <a
            class="lt-icon-link"
            href="https://share.google/Tu4m13SaoDOngwANZ"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ver no Google Maps"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2C8.686 2 6 4.686 6 8c0 4.757 6 14 6 14s6-9.243 6-14c0-3.314-2.686-6-6-6z"/>
              <circle cx="12" cy="8" r="2.25"/>
            </svg>
          </a>
        </div>
        <address class="lt-footer__address">
          R. Dom Pedro II, 132 &mdash; Centro<br />
          Campo Bom &mdash; RS, 93701-470
        </address>
      </footer>

    </div>
  </body>
</html>
